# Schedule optimization preferences

# Default buffer time before each film (in minutes)
# This accounts for buying tickets, finding seats, etc.
buffer_time_minutes: 15

# Optional: Filter films by date range
# Uncomment and set dates to limit the schedule to specific dates
# start_date: "2024-09-15"
# end_date: "2024-09-22"

# Weight adjustments based on film release year
# Positive values increase priority, negative values decrease it
# Uncomment and customize the years you care about:
year_weights:
  # 1960: 0.3   # Increase priority for 1960 films
  # 1985: 0.2   # Increase priority for 1985 films
  # 2024: -0.1  # Decrease priority for 2024 films (might have other chances to see)
  # 2025: -0.2  # Decrease priority for 2025 films
  2025: 1.0  # Increase priority for fresh films that are not yet seen
  # 2024: 0.3  # Increase slightly for 2024 films that are not yet seen

# Weight adjustment for films with special events
# Positive values prioritize films with Q&As, director appearances, etc.
# Negative values deprioritize special events if you prefer regular screenings
# Set to 0.0 for no adjustment (default)
special_notes_weight: 0.0

