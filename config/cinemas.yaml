# Cinema configuration with travel times
# Travel times are in minutes between venues
# Estimates based on cycling or taking the bus in Oslo

# Cinema name normalization
# Maps alternative names/aliases to the canonical cinema name
# All aliases are case-insensitive
cinema_aliases:
  Vika:
    - "Vika Kino"
    - "vika"
    - "vika kino"
  Cinemateket:
    - "cinemateket"
  Vega:
    - "vega"
    - "vega scene"

travel_times:
  # Cinemateket (Dronningens gate) <-> Vika Kino (Vika)
  - from: "Cinemateket"
    to: "Vika"
    minutes: 10
  
  - from: "Vika"
    to: "Cinemateket"
    minutes: 10
  
  # Cinemateket (Dronningens gate) <-> Vega (Torggata)
  - from: "Cinemateket"
    to: "Vega"
    minutes: 20
  
  - from: "Vega"
    to: "Cinemateket"
    minutes: 20
  
  # Vika Kino (Vika) <-> Vega (Torggata)
  - from: "Vika"
    to: "Vega"
    minutes: 25
  
  - from: "Vega"
    to: "Vika"
    minutes: 25

