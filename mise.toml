[tools]
python = "3.13"
uv = "latest"

[tasks.festival-planner]
run = "uv run festival-planner"
description = "Run the festival planner"

[tasks.test]
run = "uv run pytest"
description = "Run the test suite"

[tasks.check]
run = "uv run ruff check --fix"
sources = ["src/**/*.py"]
outputs = ["src/**/*.py"]

[tasks.format]
run = "uv run ruff format"
sources = ["src/**/*.py"]
outputs = ["src/**/*.py"]

[tasks.fix]
depends = ["format", "check"]
sources = ["src/**/*.py"]
outputs = ["src/**/*.py"]